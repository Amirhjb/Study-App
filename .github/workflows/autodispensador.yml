name: Build AutoDispensador mod
on:
  push:
    paths: ['autodispensador-mod/**', '.github/workflows/autodispensador.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autodispensador-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: autodispensador-jar
          path: autodispensador-mod/build/libs/autodispensador-1.0.0.jar
      - name: Probe Minecraft API
        if: always()
        run: |
          J=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          javap -cp "$J" -c -p net.minecraft.client.player.LocalPlayer | grep -n -A8 "void sendOverlayMessage" || true
