name: Build AutoDispensador mod
on:
  push:
    paths: ['autodispensador-mod/**', '.github/workflows/autodispensador.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autodispensador-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: autodispensador-jar
          path: autodispensador-mod/build/libs/autodispensador-1.0.0.jar
      - name: Probe Minecraft API
        if: always()
        run: |
          J=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          echo "== metodos que llaman a detectRateSpam"
          javap -cp "$J" -c -p net.minecraft.server.network.ServerGamePacketListenerImpl | awk '/^  [a-z].*\(/{m=$0} /detectRateSpam/{print m}' | sort -u
          echo "== handleChatCommand y lambdas"
          javap -cp "$J" -c -p net.minecraft.server.network.ServerGamePacketListenerImpl | grep -n -A25 "void handleChatCommand" | head -40
          javap -cp "$J" -p net.minecraft.client.multiplayer.ClientPacketListener | grep -i command || true
          javap -cp "$J" -p net.minecraft.world.inventory.Slot | grep -E "container|ContainerSlot" || true
          javap -cp "$J" -p net.minecraft.client.gui.components.EditBox | grep -i maxlength || true
