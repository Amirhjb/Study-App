name: Build AutoDispensador mod
on:
  push:
    paths: ['autodispensador-mod/**', '.github/workflows/autodispensador.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autodispensador-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: autodispensador-jar
          path: autodispensador-mod/build/libs/autodispensador-1.0.0.jar
      - name: Probe Minecraft API
        if: always()
        run: |
          J=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1); echo "$J"
          javap -cp "$J" -c -p net.minecraft.server.level.ServerPlayer | grep -n -A14 "boolean canDropItems" || true
          javap -cp "$J" -c -p net.minecraft.world.inventory.AbstractContainerMenu | grep -n -B3 -A3 "canDropItems" || true
          javap -cp "$J" -c -p net.minecraft.util.TickThrottler || true
          javap -cp "$J" -c -p net.minecraft.server.network.ServerGamePacketListenerImpl | grep -n -B4 -A2 "TickThrottler" || true
          javap -cp "$J" -c -p net.minecraft.world.inventory.ResultSlot | grep -n -A30 "getRemainingItems(net" | head -60 || true
