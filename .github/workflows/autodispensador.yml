name: Build AutoDispensador mod
on:
  push:
    paths: ['autodispensador-mod/**', '.github/workflows/autodispensador.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autodispensador-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: autodispensador-jar
          path: autodispensador-mod/build/libs/autodispensador-1.0.0.jar
      - name: Probe Minecraft API on failure
        if: failure()
        run: |
          J=$(find ~/.gradle ../autodispensador-mod/.gradle -name 'minecraft-*.jar' 2>/dev/null | grep -v sources | head -1); echo "$J"
          javap -cp "$J" net.minecraft.client.multiplayer.MultiPlayerGameMode | grep -i -E 'click|container|input'
          javap -cp "$J" net.minecraft.world.inventory.ContainerInput
