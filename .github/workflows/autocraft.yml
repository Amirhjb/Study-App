name: Build AutoCraft mod
on:
  push:
    paths: ['autocraft-mod/**', '.github/workflows/autocraft.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autocraft-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: autocraft-jar
          path: autocraft-mod/build/libs/autocraft-1.0.0.jar
      - name: Probe container sync
        if: always()
        run: |
          J=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          javap -cp "$J" -p net.minecraft.world.inventory.AbstractContainerMenu | grep -i stateid || true
          javap -cp "$J" -c -p net.minecraft.server.network.ServerGamePacketListenerImpl > s.txt
          echo "== handleContainerClick"; sed -n '/public void handleContainerClick/,/^$/p' s.txt | grep -E "StateId|broadcast|clicked|setRemote" || true
          javap -cp "$J" -c -p 'net.minecraft.server.level.ServerPlayer$1' > sp.txt 2>/dev/null || true
          echo "== synchronizer"; grep -E "public void send|incrementStateId|Packet.\"<init>" sp.txt | head -20 || true
