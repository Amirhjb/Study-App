name: Build AutoCraft mod
on:
  push:
    paths: ['autocraft-mod/**', '.github/workflows/autocraft.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autocraft-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: autocraft-jar
          path: autocraft-mod/build/libs/autocraft-1.0.0.jar
      - name: Probe sendCommand
        if: always()
        run: |
          J=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          javap -cp "$J" -c -p net.minecraft.client.multiplayer.ClientPacketListener > cpl.txt
          for m in "public void sendCommand" "public boolean sendUnattendedCommand" "public void sendUnattendedCommand" "CommandCheckResult verifyCommand"; do echo "== $m"; sed -n "/$m/,/^\$/p" cpl.txt | head -90; done
