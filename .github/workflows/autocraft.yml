name: Build AutoCraft mod
on:
  push:
    paths: ['autocraft-mod/**', '.github/workflows/autocraft.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autocraft-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: autocraft-jar
          path: autocraft-mod/build/libs/autocraft-1.0.0.jar
      - name: Probe carried item sync
        if: always()
        run: |
          J=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          javap -cp "$J" -c -p net.minecraft.client.multiplayer.MultiPlayerGameMode > gm.txt
          echo "== metodos que llaman a ensureHasSentCarriedItem"; awk '/^  [a-z].*\(/{m=$0} /ensureHasSentCarriedItem/{print m}' gm.txt | sort -u
          echo "== ensureHasSentCarriedItem"; sed -n '/void ensureHasSentCarriedItem/,/^$/p' gm.txt
          javap -cp "$J" -c -p net.minecraft.client.Minecraft > mc.txt
          echo "== Minecraft: quien llama a gameMode.tick"; awk '/^  [a-z].*\(/{m=$0} /MultiPlayerGameMode.tick:/{print m}' mc.txt | sort -u
          javap -cp "$J" -c -p net.minecraft.world.entity.player.Inventory | sed -n '/public void setSelectedSlot/,/^$/p'
