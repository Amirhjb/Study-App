name: Build AutoCraft mod
on:
  push:
    paths: ['autocraft-mod/**', '.github/workflows/autocraft.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autocraft-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: autocraft-jar
          path: autocraft-mod/build/libs/autocraft-1.0.0.jar
      - name: Probe Minecraft API on failure
        if: failure()
        run: |
          J=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          javap -cp "$J" -p net.minecraft.client.KeyMapping | grep -i -E "match|key" || true
