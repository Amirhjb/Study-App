<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Studium: registra tus horas de estudio, objetivos, tareas, exámenes y notas." />
    <meta name="theme-color" content="#5046e5" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235046e5'/%3E%3Cpath d='M4 9.2 12 5.2l8 4-8 4-8-4Z' fill='none' stroke='white' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M7.6 11.2V15c0 1.2 2 2.6 4.4 2.6s4.4-1.4 4.4-2.6v-3.8' fill='none' stroke='white' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Studium</title>
    <script>
      // Aplica el tema antes de pintar para evitar parpadeos.
      try {
        var d = JSON.parse(localStorage.getItem('studium-data') || '{}');
        var t = (d.state && d.state.settings && d.state.settings.theme) || 'system';
        var h = document.documentElement.getAttribute('data-theme');
        var sys = h === 'dark' || (h !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (t === 'dark' || (t === 'system' && sys)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
